[project]
name = "wills-home-assistant"
version = "0.1.0"
description = "Wake-word voice assistant: local wake word -> cloud streaming STT -> LLM with tools -> ElevenLabs TTS, controlling the house through Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "deepgram-sdk>=7",
    "httpx>=0.28",
    "numpy>=2.5.2",
    "openai>=3.6.0",
    "openwakeword>=0.6",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# openwakeword 0.6 hard-depends on tflite-runtime for Linux, which ships no
# Python 3.12 wheels and blocks resolution. We use its ONNX inference path
# (the only one on Windows anyway), so exclude tflite everywhere via an
# impossible marker. Revisit at the Pi milestone.
override-dependencies = ["tflite-runtime; python_version < '3.0'"]

[tool.uv.build-backend]
module-name = "assistant"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
